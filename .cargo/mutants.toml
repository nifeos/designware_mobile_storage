# cargo-mutants configuration, read from the crate root.

exclude_globs = [
    # src/proofs.rs is `#[cfg(kani)]` (see src/lib.rs), so `cargo test` never compiles it: a change
    # to it cannot fail any test, and every mutant of it survives for that reason alone. Kani checks
    # its proofs in CI, and each proof carries a falsification patch under falsifications/ that
    # must make Kani fail. That is this file's mutation testing.
    "src/proofs.rs",
]

# src/exported_simulator.rs and tests/simulator.rs build only with the `simulator` feature, so a
# run without it edits a file no build reads and every mutant there survives untested.
features = ["simulator"]
