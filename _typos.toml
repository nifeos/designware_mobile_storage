# Spell checking for the crate's prose and source, run by the `check / standalone` typos step. The
# house spelling is American, so the locale is fixed here, and the
# gate refuses a file whose locale is anything else.
#
# Add a word under [default.extend-words] only when it is a real name in a real document (a register
# mnemonic, a vendor, a quoted source), with the reason on the line above it. Do not add a
# misspelling to make a finding pass; fix the text.

[default]
locale = "en-us"
# The release workflow's two organization secret names, fixed by the shared release workflow. Their
# first word reads as a misspelling to typos, and the names cannot change here.
extend-ignore-identifiers-re = ["^[A-Z]+_SMELTER_(APP_ID|PRIVATE_KEY)$"]

[default.extend-words]
# The vendor's name, as it spells itself: Synopsys, not the English word "synopsis".
Synopsys = "Synopsys"
synopsys = "synopsys"
# The databook's mnemonic for the response timeout field of the timeout register (RTO), a real
# name in a real document; it is not a misspelling of "to".
RTO = "RTO"

[files]
# Generated and captured files are not prose anybody wrote.
extend-exclude = ["*.lock", "target/"]
