name: check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      security-events: write
    uses: partsfoundry/crate-workflows/.github/workflows/check.yml@6788a79d591e27062653d33ee4ffd51e0b8f6de2
    with:
      # Bare-metal targets the crate builds for, space-separated; empty for a host-only crate.
      targets: aarch64-unknown-none-softfloat riscv64imac-unknown-none-elf x86_64-unknown-none
      # The soak publishes nothing, so the manifest carries publish = false on purpose.
      allow-unpublished: true
      # The simulator feature links std, which the bare-metal targets lack, so the all-features
      # clippy pass leaves it out; the simulator job below lints and tests it on the host.
      exclude-features: simulator
  # The shared check job builds and tests the default features only. The `simulator` feature
  # exports the simulated controller and card, so it gets the same lint and the same tests, plus
  # tests/simulator.rs, which uses it from outside the crate as a caller would.
  simulator:
    name: simulator feature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable clippy --all-targets --features simulator -- -D warnings
      - run: cargo +stable test --features simulator
