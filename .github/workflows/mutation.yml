name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC.
    - cron: '27 8,10,12 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@6788a79d591e27062653d33ee4ffd51e0b8f6de2
