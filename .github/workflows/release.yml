name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, matching the manifest (e.g. 0.1.0).
        required: true
        type: string
      dry-run:
        description: Rehearse without tagging or publishing.
        type: boolean
        default: true
      publish:
        description: Publish to crates.io after tagging. False tags and stops, with no approval step.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: partsfoundry/crate-workflows/.github/workflows/release.yml@2cf764b00154c8a5dbd3252af4a6a09673a10155
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
    secrets:
      NIFE_SMELTER_APP_ID: ${{ secrets.NIFE_SMELTER_APP_ID }}
      NIFE_SMELTER_PRIVATE_KEY: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
