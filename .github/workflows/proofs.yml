name: proofs
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  proofs:
    uses: nifeos/crate-workflows/.github/workflows/proofs.yml@a6330bb8763d43948a33ba38a0f4bf576dbd57b5
    with:
      # Two harnesses at a time keep the proofs inside the job's budget. The heaviest harness
      # peaks near 6 GB, so two fit a hosted runner's 16 GB. Kani verifies in parallel only with
      # terse output.
      kani-args: --jobs 2 --output-format=terse
