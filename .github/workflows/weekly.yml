name: weekly
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekly:
    uses: nifeos/crate-workflows/.github/workflows/weekly.yml@a6330bb8763d43948a33ba38a0f4bf576dbd57b5
    with:
      # The bare-metal targets ci.yml names, so drift and msrv build them too.
      targets: aarch64-unknown-none-softfloat riscv64imac-unknown-none-elf x86_64-unknown-none
    secrets:
      SETTINGS_TOKEN: ${{ secrets.SETTINGS_TOKEN }}
